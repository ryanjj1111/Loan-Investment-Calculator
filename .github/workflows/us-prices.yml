# 美股收盤後抓固定範圍（S&P 500＋Nasdaq-100＋固定 ETF 清單）的收盤價與財報日。公開資料，不含任何個人持股。
name: 美股收盤價
on:
  schedule:
    - cron: '37 22 * * 1-5'   # 台灣週二～週六 06:37
    - cron: '37 1 * * 2-6'    # 台灣週二～週六 09:37（重試）
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/fetch-us.py', '.github/workflows/us-prices.yml', 'data/mkt/holidays.json']
permissions:
  contents: write
concurrency:
  group: us-prices-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 價格不是最新時會等 5 分鐘再重抓一次
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance pandas lxml requests
      - name: 抓價格與財報日
        id: fetch
        run: python tools/fetch-us.py
      - name: 存檔
        # 推送 claude/ 分支觸發的是測試實跑：只看結果、不存檔（存了會和 main 的資料衝突，2026-11-18 PR #45）
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/us data/mkt/us.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "美股收盤價 $(TZ=Asia/Taipei date +%F' '%H:%M) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
      # 財報日、指數照樣存檔；個股價格不是最新時，這一步讓整個流程顯示失敗（GitHub 會寄信），原因寫在 Summary 頁
      - name: 確認價格是最新
        if: steps.fetch.outputs.px_ok != 'true'
        run: |
          echo "::error::美股收盤價不是最新，原因見 Summary 頁"
          exit 1
