# 自動檢核卡：每個交易日抓全市場的法人買賣超、融資、月營收、股權分散與成交量（公開資料，不含任何個人持股）
name: 檢核資料
on:
  push:
    branches: ['claude/**']
    paths: ['tools/probe-checks.mjs', 'tools/fetch-checks.mjs', '.github/workflows/checks.yml']
permissions:
  contents: write
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 測試資料來源
        run: node tools/probe-checks.mjs
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "檢核資料測試 [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
