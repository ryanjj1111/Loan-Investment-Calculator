# 每個營業日傍晚抓臺灣銀行牌告的美金即期匯率（公開資料，不含任何個人資料），給資產頁「總覽」換算新台幣
name: 匯率
on:
  schedule:
    - cron: '37 8 * * 1-5'    # 台灣 16:37
    - cron: '7 10 * * 1-5'    # 台灣 18:07（重試）
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/fetch-fx.mjs', '.github/workflows/fx.yml']
permissions:
  contents: write
concurrency:
  group: fx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓匯率
        run: node tools/fetch-fx.mjs
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/fx
          if git diff --cached --quiet; then echo "沒有新匯率"; exit 0; fi
          git commit -m "匯率 $(TZ=Asia/Taipei date +%F' '%H:%M) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
